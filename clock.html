<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock — Yuhan's Desk</title>
<meta name="description" content="A clock widget, four world clocks and a 25/5 focus timer.">
<link rel="icon" href="Images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="Images/icon-180.png">
<meta name="theme-color" content="#0b0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="nav__brand" href="index.html">Yuhan<span>.</span>Desk</a>
  <div class="nav__links">
    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="study.html">Study</a>
    <a href="clock.html" aria-current="page">Clock</a>
    <a href="ledger.html">Ledger</a>
    <a href="tarot.html">Tarot</a>
  </div>
</nav>

<main class="shell tool">
  <header class="tool__head">
    <h1>Clock</h1>
    <p>One widget, two jobs: the clock, or a countdown to whatever is next. Pick a length
       from one minute to an hour and start it.</p>
  </header>

  <section class="cw" aria-label="Clock widget">
    <div class="cw__tabs" role="tablist" aria-label="View">
      <button class="cw__tab" type="button" role="tab" id="tabClock" aria-selected="true" aria-controls="paneClock">Clock</button>
      <button class="cw__tab" type="button" role="tab" id="tabTimer" aria-selected="false" aria-controls="paneTimer">Timer</button>
    </div>

    <div class="cw__pane" id="paneClock" role="tabpanel" aria-labelledby="tabClock">
      <svg class="cw__svg" viewBox="0 0 300 300" role="img" aria-label="Analogue clock">
        <g id="ticks"></g>
        <text class="cw__num" x="150" y="54" text-anchor="middle" dominant-baseline="central">12</text>
        <text class="cw__num" x="246" y="150" text-anchor="middle" dominant-baseline="central">3</text>
        <text class="cw__num" x="150" y="246" text-anchor="middle" dominant-baseline="central">6</text>
        <text class="cw__num" x="54" y="150" text-anchor="middle" dominant-baseline="central">9</text>

        <g id="hourGroup">
          <line id="hourHand" x1="150" y1="150" x2="150" y2="86" stroke="#17171d" stroke-width="9" stroke-linecap="round"/>
          <circle id="hourDot" cx="150" cy="86" r="6.5" fill="#17171d"/>
        </g>
        <g id="minGroup">
          <line id="minHand" x1="150" y1="150" x2="150" y2="54" stroke="#17171d" stroke-width="7" stroke-linecap="round"/>
          <circle id="minDot" cx="150" cy="54" r="5" fill="#17171d"/>
        </g>
        <g id="secGroup">
          <line id="secHand" x1="150" y1="170" x2="150" y2="38" stroke="#ff453a" stroke-width="3" stroke-linecap="round"/>
          <circle id="secDot" cx="150" cy="38" r="4.5" fill="#ff453a"/>
        </g>
        <circle cx="150" cy="150" r="7" fill="#17171d"/>
      </svg>
    </div>

    <div class="cw__pane" id="paneTimer" role="tabpanel" aria-labelledby="tabTimer" hidden>
      <p class="cw__mode" id="mode">Countdown · 25 minutes</p>
      <p class="cw__count" id="countdown">25:00</p>
      <div class="cw__actions">
        <button class="cw__btn cw__btn--dark" id="toggle" type="button">Start</button>
        <button class="cw__btn" id="resetTimer" type="button">Reset</button>
      </div>
      <div class="cw__presets" id="presets" role="group" aria-label="Countdown presets"></div>
      <p class="cw__rounds" id="rounds">Pick a length, or start with twenty-five.</p>
    </div>

    <div class="cw__chips">
      <span class="cw__chip" id="chipTime">--:--</span>
      <span class="cw__chip cw__chip--wide" id="chipDate">—</span>
    </div>
  </section>


</main>

<script src="nav.js"></script>
<script>
  /* ---------- the ticks ---------- */
  (function () {
    const ticks = document.getElementById('ticks');
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      const angle = (i / 60) * Math.PI * 2;
      const r1 = major ? 110 : 116;
      const r2 = 123;
      line.setAttribute('x1', String(150 + Math.sin(angle) * r1));
      line.setAttribute('y1', String(150 - Math.cos(angle) * r1));
      line.setAttribute('x2', String(150 + Math.sin(angle) * r2));
      line.setAttribute('y2', String(150 - Math.cos(angle) * r2));
      line.setAttribute('stroke', major ? 'rgba(23,23,29,0.38)' : 'rgba(23,23,29,0.18)');
      line.setAttribute('stroke-width', major ? '2.2' : '1.2');
      line.setAttribute('stroke-linecap', 'round');
      ticks.appendChild(line);
    }
  })();

  /* ---------- the hands ---------- */
  const hourGroup = document.getElementById('hourGroup');
  const minGroup = document.getElementById('minGroup');
  const secGroup = document.getElementById('secGroup');
  const chipTime = document.getElementById('chipTime');
  const chipDate = document.getElementById('chipDate');

  function paintClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    hourGroup.setAttribute('transform', 'rotate(' + (h * 30) + ' 150 150)');
    minGroup.setAttribute('transform', 'rotate(' + (m * 6) + ' 150 150)');
    secGroup.setAttribute('transform', 'rotate(' + (s * 6) + ' 150 150)');

    chipTime.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    chipDate.textContent = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', weekday: 'short' });
  }
  paintClock();
  setInterval(paintClock, 1000);

  /* ---------- clock / timer ---------- */
  (function () {
    const tabClock = document.getElementById('tabClock');
    const tabTimer = document.getElementById('tabTimer');
    const paneClock = document.getElementById('paneClock');
    const paneTimer = document.getElementById('paneTimer');

    function show(which) {
      const isClock = which === 'clock';
      tabClock.setAttribute('aria-selected', String(isClock));
      tabTimer.setAttribute('aria-selected', String(!isClock));
      paneClock.hidden = !isClock;
      paneTimer.hidden = isClock;
      document.querySelector('.cw').classList.toggle('is-timer', !isClock);
    }
    tabClock.addEventListener('click', function () { show('clock'); });
    tabTimer.addEventListener('click', function () { show('timer'); });
    show('clock');
  })();

  /* ---------- the countdown ---------- */
  (function () {
    const PRESETS = [1, 3, 5, 10, 15, 25, 45, 60];

    let minutes = 25;
    let left = minutes * 60;
    let running = false;
    let handle = 0;
    let finished = false;

    const modeEl = document.getElementById('mode');
    const countdown = document.getElementById('countdown');
    const toggle = document.getElementById('toggle');
    const resetBtn = document.getElementById('resetTimer');
    const presetsEl = document.getElementById('presets');
    const roundsEl = document.getElementById('rounds');

    function paint() {
      const m = Math.floor(left / 60);
      const s = left % 60;
      countdown.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      modeEl.textContent = 'Countdown · ' + minutes + (minutes === 1 ? ' minute' : ' minutes');
      toggle.textContent = running ? 'Pause' : (finished ? 'Again' : (left === minutes * 60 ? 'Start' : 'Resume'));
      roundsEl.textContent = finished
        ? 'Time is up. Pick another length, or go again.'
        : 'Pick a length, or start with twenty-five.';

      Array.prototype.forEach.call(presetsEl.children, function (chip) {
        chip.setAttribute('aria-pressed', String(Number(chip.dataset.min) === minutes));
      });
    }

    function stop() {
      running = false;
      clearInterval(handle);
      handle = 0;
      paint();
    }

    function start() {
      if (finished) {
        finished = false;
        left = minutes * 60;
      }
      running = true;
      handle = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          left = 0;
          finished = true;
          stop();
          document.title = 'Time is up — Yuhan\'s Desk';
          return;
        }
        paint();
      }, 1000);
      document.title = 'Clock — Yuhan\'s Desk';
      paint();
    }

    function choose(length) {
      stop();
      minutes = length;
      left = minutes * 60;
      finished = false;
      paint();
    }

    PRESETS.forEach(function (length) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'cw__preset';
      chip.dataset.min = String(length);
      chip.textContent = length + ' min';
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () { choose(length); });
      presetsEl.appendChild(chip);
    });

    toggle.addEventListener('click', function () { if (running) stop(); else start(); });
    resetBtn.addEventListener('click', function () {
      stop();
      left = minutes * 60;
      finished = false;
      paint();
    });

    paint();
  })();
</script>
</body>
</html>
